name: Checkstyle and Tests

on:
  pull_request:
    branches:
      - 'main'
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Checkstyle, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: semeru
          cache: maven

      - name: Build and Test
        run: mvn -B clean compile verify checkstyle:check

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports

  verify-commits:
    name: Verify Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=$(git log --no-merges --invert-grep --grep='^Signed-off-by: .* <.*>' \
                      --format='%h %s' "$BASE_SHA..$HEAD_SHA")
          if [ -n "$missing" ]; then
            echo "::error::These commits are missing a Signed-off-by line:"
            echo "$missing"
            exit 1
          fi
